name: CI

# Every push and every pull request. The whole suite is offline - GitHub and
# Ollama are both mocked at the httpx transport layer - so CI needs no secrets,
# no API quota and no model. That is the point: a test that needs a 3.3 GB model
# is a test nobody runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Developed on 3.14; 3.12 is included so the project does not quietly
        # acquire a dependency on the newest interpreter without anyone noticing.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Fail if a secret reached the bundle
        working-directory: frontend
        # Vite inlines every VITE_ variable into the public bundle, so a secret
        # passed as one is readable by anyone who opens the page. This checks
        # for credential *values*; the string "GITHUB_TOKEN" appears
        # legitimately in user-facing help text and is not matched.
        run: |
          if grep -rqE "(ghp_|gho_|ghs_|ghu_|github_pat_)[A-Za-z0-9_]{20,}" dist/; then
            echo "::error::A credential-shaped value is present in the built bundle."
            exit 1
          fi
          echo "No credentials in the bundle."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No credential may be committed
        # The one that nearly happened: a real fine-grained PAT pasted into
        # backend/.env.example, which is tracked on purpose because it is the
        # template. Test fixtures using obviously fake tokens are excluded.
        # `git grep` searches tracked files only, which is exactly the question
        # being asked: what is committed?
        run: |
          if git grep -InE "(ghp_|gho_|ghs_|ghu_|github_pat_)[A-Za-z0-9_]{20,}" \
               | grep -v "notarealtoken\|A1b2C3"; then
            echo "::error::A credential is committed to this repository."
            exit 1
          fi
          echo "No credentials committed."

      - name: .env must never be tracked
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "::error::A .env file is tracked. Only .env.example belongs in git."
            exit 1
          fi
          echo "No .env tracked."

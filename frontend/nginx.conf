# ==============================================================================
# Serves the built SPA and proxies the API, so the browser sees ONE origin.
#
# That single fact removes CORS from the deployment entirely: the page and its
# API calls share a scheme, host and port, so no preflight is made and no origin
# list has to be kept in step with the frontend's URL.
# ==============================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever their content does, so they can be
    # cached indefinitely. index.html must not be, or a deploy would keep
    # serving the previous build's asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A single-page app: any path that is not a real file is the app's own route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # An analysis is three passes of a local model. On CPU that is minutes,
        # not seconds - measured at 307s for a 15-file repository on a 2-core
        # laptop. The default 60s timeout would cut every analysis short, so the
        # read timeout is raised well past the backend's own OLLAMA_TIMEOUT.
        proxy_connect_timeout 30s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;

        # Responses are JSON delivered in one piece; buffering them adds latency
        # for no benefit here.
        proxy_buffering off;
    }

    # Modest hardening for a page that renders model output. The app itself
    # never injects HTML - React escapes everything - but these cost nothing.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
